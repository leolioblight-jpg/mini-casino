s1:["À l'auberge, une archère aux yeux d'ambre nettoie ses flèches. « Je m'appelle Lyra. Je connais les chemins de la montagne… pour 50 pièces, je suis à toi. »",[["Engager Lyra (−50 🪙)","s1b","g-50,clyra,flyra","!flyra&$50"],["Offrir un verre et écouter les rumeurs","s1c","frum","!frum"],["Retour","hub"]]],
s1b:["Lyra sourit en rangeant ses flèches. « Marché conclu. Je te couvre de loin. »",[["Retour à la place","hub"]]],
s1c:["Un chasseur murmure : « Les loups de la forêt sont devenus fous. Mais il existe un vieux tunnel de mineurs qui évite le sentier. »",[["Retour","hub"]]],
s2:["La forge est en flammes. Un nain massif, Brok, tient son marteau face à deux pillards. « Un coup de main, l'humain ? »",[["⚔️ L'aider","s2f",null,"!fbrok"],["Retour","hub"]]],
s2f:["Les pillards se jettent sur vous !",null,{en:[["🗡️","Pillard",0,.9],["🗡️","Pillard",0,.9]],win:"s2w",rew:120},"Combat"],
s2w:["Brok essuie son marteau. « Tu as du cran. Je viens avec toi, et ma forge sera à toi après cette histoire de dragon. »",[["Retour à la place","hub","cbrok,fbrok"]]],
s3:["Le vieux sage lit dans les cendres. « Vorath n'est pas un monstre : il est furieux, on lui a volé son œuf. Rends-le-lui et la guerre n'aura pas lieu. Prends cette amulette : elle te fera comprendre sa langue. Cherche l'œuf au sanctuaire oublié. »",[["Prendre l'amulette (+100 🪙 de talismans)","hub","g100,fsage","!fsage"],["Retour","hub"]]],
f1:["La Forêt Brumeuse avale la lumière. Des yeux jaunes brillent entre les troncs. Deux chemins : le sentier, direct mais gardé, ou le vieux tunnel de mineurs.",[["Suivre le sentier","f2"],["Prendre le tunnel secret","f3",null,"frum"],["Retourner au village","hub"]]],
f2:["Une meute de loups enragés surgit du brouillard !",null,{en:[["🐺","Loup enragé",1,.9],["🐺","Loup enragé",1,.9],["🐺","Loup alpha",1,1.2]],win:"f4",rew:200},"Combat"],
f3:["Dans le tunnel, tu évites les loups et trouves un coffre de mineur oublié.",[["Ouvrir le coffre (+150 🪙)","f4","g150,ftun","!ftun"],["Continuer","f4"]]],
f4:["Une clairière. Au centre, un sanctuaire en ruine où brille un œuf de cristal, gardé par un spectre.",[["⚔️ Affronter le spectre","f4f",null,"!fegg"],["Monter vers la tanière du dragon","f6",null,"fegg"],["Retourner au village","hub"]]],
f4f:["Le spectre hurle et se jette sur vous.",null,{en:[["👻","Spectre gardien",2,1],["💀","Âme errante",1,.9]],win:"f5",rew:300},"Combat"],
f5:["Le spectre se dissipe. L'œuf de cristal palpite doucement dans tes mains. Tu le prends.",[["Monter vers la tanière du dragon","f6","fegg"]]],
f6:["La tanière est un océan de braises. Vorath déploie ses ailes et sa voix résonne comme un orage : « Qui ose ? »",[["🥚 Lui tendre l'œuf et lui parler","e1",null,"fegg&fsage"],["⚔️ Attaquer de front !","bf"],["Fuir vers le village","hub"]]],
c1:["Trois jours ont passé. Un mal étrange court dans Kiri : des villageois se couvrent d'une marque noire au front, le regard vide, et marchent vers le sud sans un mot. Au loin, la cité de Mornelune brûle d'une lueur violette.",[["🔍 Examiner un villageois marqué","c2",null,"!fclue"],["🔨 Demander conseil à Brok","c3",null,"cbrok&!fmap"],["🏹 Écouter Lyra","c3b",null,"clyra&!flk"],["🛤️ Prendre la route de Mornelune","c4"]]],
c2:["Un villageois se retourne d'un coup, les yeux noirs : « Elle vous attend… » Il t'attaque !",null,{en:[["🌑","Villageois possédé",1,1],["🌑","Ombre rampante",1,1]],win:"c2w",rew:200},"Combat"],
c2w:["Quand l'ombre s'éteint, le villageois murmure : « Maelis… la Tour de Mornelune… » Puis il s'évanouit, libéré.",[["Retour","c1","fclue"]]],
c3:["Brok gratte sa barbe. « Cette marque, je l'ai déjà vue sur de vieux marteaux. C'est de la magie d'ombre : elle ne tient que grâce à un cristal noir, tout en haut d'une tour. Brise-le et tout s'arrête. » Il te glisse une bourse (+80 🪙).",[["Merci Brok","c1","fmap,g80"]]],
c3b:["Lyra murmure : « Les gardes de Mornelune sont marqués aussi. Mais je connais une entrée par les égouts. »",[["Noté","c1","flk"]]],
c4:["La route est coupée par des brigands marqués qui exigent un péage.",[["Payer 100 🪙","c5","g-100","$100"],["⚔️ Les affronter","c4f"]]],
c4f:["Les brigands dégainent !",null,{en:[["🗡️","Brigand marqué",1,1],["🗡️","Brigand marqué",1,1],["🏴","Chef brigand",2,.9]],win:"c5",rew:250},"Combat"],
c5:["Les remparts de Mornelune se dressent, gardés par des soldats au front noir. La grande porte est fermée.",[["🏹 Passer par les égouts avec Lyra","c6",null,"flk"],["⚔️ Forcer la porte","c5f"]]],
c5f:["Les gardes se mettent en rang !",null,{en:[["🛡️","Garde marqué",2,.9],["🛡️","Garde marqué",2,.9]],win:"c6",rew:300},"Combat"],
c6:["Dans la cité, une bibliothèque abandonnée. Un journal dévoile la vérité : Maelis, ancienne apprentie du sage, avait volé l'œuf de Vorath pour réveiller le dragon et sauver sa ville d'une peste. Mais l'ombre l'a corrompue. (+100 🪙)",[["Lire jusqu'au bout","c7","g100,fjournal","!fjournal"],["Monter à la tour","c7","","fjournal"]]],
c7:["Dans l'escalier de la tour, deux chevaliers d'ombre bloquent le palier.",null,{en:[["⚫","Chevalier d'ombre",2,1],["⚫","Chevalier d'ombre",2,1]],win:"c8",rew:400},"Combat"],
c8:["Au sommet, Maelis flotte devant un cristal noir qui pulse. « Tu viens me tuer, comme les autres ? » Ses yeux hésitent.",[["💬 Lui parler du journal et de l'œuf","e3",null,"fjournal&fclue"],["⚔️ Briser le cristal par la force","bm"]]],
bm:["Maelis hurle, le cristal explose en éclats noirs !",null,{en:[["🔮","Maelis, l'Ombre",4,.9],["🌑","Écho d'ombre",1,1]],win:"e4",rew:800},"BOSS"],
e3:["Maelis tombe à genoux. « Je voulais juste sauver ma ville… » Ensemble, vous brisez le cristal sans violence. Les marques s'effacent et Kiri retrouve ses villageois. Maelis rejoint le sage pour réparer ses erreurs. À suivre : Chapitre 3…",[["➡️ Chapitre 3","G3A","g500"],["Rejouer l'histoire (+1500 🪙)","s0","g1500,x"]],null,"FIN 3 — L'Apprentie Rachetée"],
e4:["Le cristal vole en éclats, les marques disparaissent. Maelis s'écroule, vaincue, et murmure : « Ce n'était qu'un début… » Une porte noire s'ouvre dans le ciel. À suivre : Chapitre 3…",[["➡️ Chapitre 3","G3A","g300"],["Rejouer l'histoire (+1200 🪙)","s0","g1200,x"]],null,"FIN 4 — La Marque Brisée"],
e1:["Vorath renifle l'œuf, son regard s'adoucit. « Humain… tu aurais pu me tuer. » Il s'envole, apaisé, et la terre cesse de trembler. Kiri est sauvé sans une goutte de sang. Le dragon te laisse une écaille dorée.",[["➡️ Chapitre 2","c1","g500"],["Rejouer l'histoire (+1000 🪙)","s0","g1000,x"]],null,"FIN 1 — Le Pacte du Dragon"],
bf:["Vorath rugit et crache un torrent de flammes !",null,{en:[["🐉","Vorath le Dragon",3,1.1]],win:"e2",rew:500},"BOSS"],
e2:["Vorath s'effondre dans un grondement. Les villageois te portent en triomphe. Au loin, une silhouette encapuchonnée t'observe, une marque noire sur le front : une autre menace se prépare. À suivre : Chapitre 2…",[["➡️ Chapitre 2","c1","g300"],["Rejouer l'histoire (+800 🪙)","s0","g800,x"]],null,"FIN 2 — Tueur de Dragon"]};
